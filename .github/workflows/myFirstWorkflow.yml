name: my-first-workflow
on:
  push:
    branches:
      - dev
      - main
      - 'feature-*'
  workflow_dispatch:
jobs:
  job1:
    name: JOB1
    runs-on: ubuntu-latest
    steps:
      - name: step-1
        run: |
          pwd
          ls -ltr
          hostname
      - name: step-2-checkout
        uses: actions/checkout@v7.0.1
      - name: step-3
        run: |
          pwd
          echo 'Hi this is artifact upload test file' >> myartifact.txt 
          ls -ltr
          hostname
      - name: Upload single File
        uses: actions/upload-artifact@v7.0.1
        with:
          name: single_file
          path: ./myartifact.txt
      - name: Download  artifacts
        uses: actions/download-artifact@v8.0.0
        with:
          name: single_file
          path: ./downloaded_directory
      - name: Test downloaded file
        run: |
          ls -ltr
          cd downloaded_directory
          ls -ltr 
          cat myartifact.txt
          


          
