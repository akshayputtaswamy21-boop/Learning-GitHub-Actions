name: my-first-workflow
on:
#  push:
#    branches:
#      - dev
  workflow_dispatch:
  pull_request:
    branches:
      - main
permissions:
  actions: read
  security-events: write
  packages: write
  contents: read
  
jobs:
  ci-pipeline-job:
    uses: akshayputtaswamy21-boop/reusable-workflows/.github/workflows/ci-pipeline.yml@main
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKENS: ${{ secrets.DOCKERHUB_TOKENS }}


