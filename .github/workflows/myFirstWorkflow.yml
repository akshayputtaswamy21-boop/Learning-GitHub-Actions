name: my-first-workflow
on:
#  push:
#    branches:
#      - dev
#  workflow_dispatch:

  pull_request:
    branches:
      - main
permissions:
  actions: read
  security-events: write
  packages: write
  contents: read

jobs:
  ci-pipeline-job:
    uses:  Akshay-Puttaswamy-Dev-ops/reusable-workflows/.github/workflows/ci-pipeline.yml@main
    with:
      run_code_ql: true
      run_sonarqube: true
      run_build: true
      run_ghcr_publish: true
    secrets:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}


